[versions]
android-gradle-plugin = "9.4.0"
android-compileSdk = "35"
android-minSdk = "26"
android-targetSdk = "35"
compose = "1.7.3"
# 5.13 is the last line that needs only Java 8, which Android provides; later ones need Java 11+.
jgit = "5.13.3.202401111512-r"
kotlin = "2.3.20"
kotlinx-browser = "0.5.0"
kotlinx-datetime = "0.8.0-0.6.x-compat"
kotlinx-serialization = "1.7.3"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
jgit = { module = "org.eclipse.jgit:org.eclipse.jgit", version.ref = "jgit" }
kotlinx-browser = { module = "org.jetbrains.kotlinx:kotlinx-browser-wasm.js", version.ref = "kotlinx-browser" }

[plugins]
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "android-gradle-plugin" }
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
