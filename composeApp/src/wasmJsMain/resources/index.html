<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Budget Book</title>
    <script>
      if (navigator.language.toLowerCase().startsWith("ja")) {
        document.documentElement.lang = "ja";
        document.title = "家計簿";
      }
    </script>
    <style>
      html,body,#composeApp{
        margin:0;
        width:100%;
        height:100%;
        font-family:system-ui,sans-serif
      }
    </style>
  </head>
  <body>
    <div id="warning">
      error: none
    </div>
    <div id="composeApp">
    </div>
    <script src="composeApp.js">
    </script>
  </body>
  <script type="application/javascript" >
      const unhandledError = (event, error) => {
              document.getElementById("warning").textContent = error;
      }
      addEventListener("error", (event) => unhandledError(event, event.error));
      addEventListener("unhandledrejection", (event) => unhandledError(event, event.reason));
  </script>
</html>
