# Runs the tests on the JVM, compiles the web version and builds an unsigned debug APK, for pull
# requests to master and pushes to other branches. It has no secrets.
name: Test

on:
  pull_request:
    branches: [master]
  push:
    branches-ignore: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Test and build
        run: |
          set -o pipefail
          ./gradlew --continue :composeApp:testAndroidHostTest :composeApp:compileKotlinWasmJs :androidApp:assembleDebug 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Annotations can be read without signing in, unlike the logs: put the compiler errors and
      # the failed tests in one.
      - name: Report the errors
        if: failure()
        run: |
          {
            grep -E -A2 '^e: |What went wrong' "$RUNNER_TEMP/build.log" || true
            find composeApp/build/test-results -name '*.xml' -print0 2>/dev/null \
              | xargs -0 -r grep -h -A8 '<failure' || true
          } | head -c 30000 > "$RUNNER_TEMP/errors.txt"
          body=$(sed -e 's/%/%25/g' "$RUNNER_TEMP/errors.txt" | sed -e ':a;N;$!ba;s/\r//g;s/\n/%0A/g')
          echo "::error title=Build errors::$body"
