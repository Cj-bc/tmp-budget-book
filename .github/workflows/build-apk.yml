# Builds and signs an APK with an environment's secrets, and uploads it as an artifact.
# Called by debug-apk.yml and release-apk.yml.
name: Build APK

on:
  workflow_call:
    inputs:
      environment:
        description: The environment whose secrets to use (debug or release).
        type: string
        required: true
      build-type:
        description: The Android build type to assemble (debug or release).
        type: string
        required: true
      ref:
        description: The commit to build. Defaults to the one of the event.
        type: string
        default: ""
      artifact-name:
        description: The name of the artifact, and of the APK in it (without .apk).
        type: string
        required: true
      retention-days:
        type: number
        default: 30
      version-name:
        description: Passed as -Pkakeibo.versionName if not empty.
        type: string
        default: ""
      version-code:
        description: Passed as -Pkakeibo.versionCode if not empty.
        type: string
        default: ""

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      # Also validates the Gradle wrapper. Release builds don't use the cache, so that nothing
      # written by another build ends up in a release.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: ${{ inputs.build-type == 'release' }}

      - name: Check the inputs and secrets
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          BUILD_TYPE: ${{ inputs.build-type }}
          KAKEIBO_GITHUB_CLIENT_ID: ${{ secrets.KAKEIBO_GITHUB_CLIENT_ID }}
          KAKEIBO_GITHUB_CLIENT_SECRET: ${{ secrets.KAKEIBO_GITHUB_CLIENT_SECRET }}
          KAKEIBO_KEYSTORE_BASE64: ${{ secrets.KAKEIBO_KEYSTORE_BASE64 }}
          KAKEIBO_KEYSTORE_PASSWORD: ${{ secrets.KAKEIBO_KEYSTORE_PASSWORD }}
          KAKEIBO_KEY_ALIAS: ${{ secrets.KAKEIBO_KEY_ALIAS }}
          KAKEIBO_KEY_PASSWORD: ${{ secrets.KAKEIBO_KEY_PASSWORD }}
        run: |
          case "$BUILD_TYPE" in
            debug | release) ;;
            *) echo "::error::Unknown build type: $BUILD_TYPE"; exit 1 ;;
          esac
          # Without the keystore, the APK would be signed with another key and couldn't update
          # the installed app. The app treats a missing client ID or secret as sync not set up.
          missing=0
          for name in KAKEIBO_KEYSTORE_BASE64 KAKEIBO_KEYSTORE_PASSWORD KAKEIBO_KEY_ALIAS KAKEIBO_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in the $ENVIRONMENT environment."
              missing=1
            fi
          done
          for name in KAKEIBO_GITHUB_CLIENT_ID KAKEIBO_GITHUB_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::warning::$name is not set in the $ENVIRONMENT environment."
            fi
          done
          exit "$missing"

      - name: Decode the keystore
        env:
          KAKEIBO_KEYSTORE_BASE64: ${{ secrets.KAKEIBO_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KAKEIBO_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
          echo "KAKEIBO_KEYSTORE_FILE=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          BUILD_TYPE: ${{ inputs.build-type }}
          VERSION_NAME: ${{ inputs.version-name }}
          VERSION_CODE: ${{ inputs.version-code }}
          KAKEIBO_GITHUB_CLIENT_ID: ${{ secrets.KAKEIBO_GITHUB_CLIENT_ID }}
          KAKEIBO_GITHUB_CLIENT_SECRET: ${{ secrets.KAKEIBO_GITHUB_CLIENT_SECRET }}
          KAKEIBO_KEYSTORE_PASSWORD: ${{ secrets.KAKEIBO_KEYSTORE_PASSWORD }}
          KAKEIBO_KEY_ALIAS: ${{ secrets.KAKEIBO_KEY_ALIAS }}
          KAKEIBO_KEY_PASSWORD: ${{ secrets.KAKEIBO_KEY_PASSWORD }}
        run: |
          args=()
          if [ -n "$VERSION_NAME" ]; then args+=("-Pkakeibo.versionName=$VERSION_NAME"); fi
          if [ -n "$VERSION_CODE" ]; then args+=("-Pkakeibo.versionCode=$VERSION_CODE"); fi
          ./gradlew ":androidApp:assemble${BUILD_TYPE^}" "${args[@]}"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/keystore.jks"

      - name: Name the APK
        env:
          BUILD_TYPE: ${{ inputs.build-type }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
        run: |
          mkdir "$RUNNER_TEMP/apk"
          mv "androidApp/build/outputs/apk/$BUILD_TYPE/androidApp-$BUILD_TYPE.apk" "$RUNNER_TEMP/apk/$ARTIFACT_NAME.apk"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/apk/${{ inputs.artifact-name }}.apk
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
