# Builds the release APK when a release is published, and attaches it to the release.
name: Release APK

on:
  release:
    types: [published]

permissions: {}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      name: ${{ steps.version.outputs.name }}
    steps:
      - id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          name="${TAG#v}"
          if ! [[ "$name" =~ ^[0-9A-Za-z][0-9A-Za-z.+-]*$ ]]; then
            echo "::error::The tag $TAG doesn't make a version name."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/build-apk
        with:
          environment: release
          build-type: release
          artifact-name: kakeibo-${{ needs.version.outputs.name }}
          # Only passes the APK to the attach job.
          retention-days: "1"
          version-name: ${{ needs.version.outputs.name }}
          # Increases with every release, so that each one updates the installed app.
          version-code: ${{ github.run_number }}
          keystore-base64: ${{ secrets.KAKEIBO_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.KAKEIBO_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.KAKEIBO_KEY_ALIAS }}
          key-password: ${{ secrets.KAKEIBO_KEY_PASSWORD }}
          github-client-id: ${{ secrets.KAKEIBO_GITHUB_CLIENT_ID }}
          github-client-secret: ${{ secrets.KAKEIBO_GITHUB_CLIENT_SECRET }}
          github-app-slug: ${{ vars.KAKEIBO_GITHUB_APP_SLUG }}

  # Separate from the build, so that the job that can write to the repository has no secrets.
  attach:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: kakeibo-${{ needs.version.outputs.name }}
          path: kakeibo-${{ needs.version.outputs.name }}.apk

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/kakeibo-${{ needs.version.outputs.name }}.apk --repo "$REPOSITORY" --clobber
